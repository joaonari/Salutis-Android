<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'Salutis – ' + ${titulo}">Salutis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-md navbar-dark mb-4" style="background:#0B5394">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/dashboard">SALUTIS</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#m"><span class="navbar-toggler-icon"></span></button>
    <div id="m" class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/agendar">Agendar</a></li>
        <li class="nav-item"><a class="nav-link" href="/consultas">Minhas Consultas</a></li>
        <li class="nav-item"><a class="nav-link" href="/historico">Histórico</a></li>
      </ul>
      <a class="btn btn-outline-light btn-sm" href="/sair">Sair</a>
    </div>
  </div>
</nav>
<div th:fragment="avisos">
  <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
  <div class="alert alert-success" th:if="${ok}" th:text="${ok}"></div>
</div>
<script th:fragment="js" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
