<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('SALUTIS – Seu portal de saúde')}"></head>
<body class="bg-light">
<main class="container py-5" style="max-width:420px">
<h2 class="text-center mb-4" style="color:#0B5394">SALUTIS – Seu portal de saúde</h2>
<div th:replace="~{layout :: avisos}"></div>
